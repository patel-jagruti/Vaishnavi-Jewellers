<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Premium Gold Gradients - Rich Metallic -->
    <linearGradient id="luxuryGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDF6E3"/>
      <stop offset="12%" stop-color="#F5E6A3"/>
      <stop offset="28%" stop-color="#E8C85A"/>
      <stop offset="42%" stop-color="#D4AF37"/>
      <stop offset="58%" stop-color="#C9A227"/>
      <stop offset="72%" stop-color="#D4AF37"/>
      <stop offset="85%" stop-color="#F0DC70"/>
      <stop offset="100%" stop-color="#FDF6E3"/>
    </linearGradient>

    <linearGradient id="goldHorizontal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8942E"/>
      <stop offset="25%" stop-color="#E8D070"/>
      <stop offset="45%" stop-color="#FFF8E7"/>
      <stop offset="55%" stop-color="#FFFEF5"/>
      <stop offset="65%" stop-color="#F5E6A3"/>
      <stop offset="85%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B7020"/>
    </linearGradient>

    <linearGradient id="goldDiagonal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="35%" stop-color="#E8D070"/>
      <stop offset="50%" stop-color="#FFF8E7"/>
      <stop offset="65%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B7020"/>
    </linearGradient>

    <linearGradient id="crownGold" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6B5518"/>
      <stop offset="20%" stop-color="#A88420"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="55%" stop-color="#F0DC70"/>
      <stop offset="65%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#B8942E"/>
      <stop offset="100%" stop-color="#6B5518"/>
    </linearGradient>

    <linearGradient id="diamondGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E8F4F8"/>
      <stop offset="45%" stop-color="#D0E8F0"/>
      <stop offset="55%" stop-color="#B8D8E8"/>
      <stop offset="70%" stop-color="#E0F4F8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="embossDeep" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="3" dy="5" result="offset"/>
      <feGaussianBlur stdDeviation="3" in="SourceAlpha" result="blur"/>
      <feSpecularLighting surfaceScale="8" specularConstant="1.1" specularExponent="22" lighting-color="#FFFFFF" in="blur" result="specular">
        <fePointLight x="-5000" y="-10000" z="15000"/>
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceAlpha" operator="in" result="specularOut"/>
      <feComposite in="SourceGraphic" in2="specularOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
      <feMerge>
        <feMergeNode in="offset"/>
        <feMergeNode/>
      </feMerge>
    </filter>

    <filter id="premiumShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <filter id="textEmboss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
      <feSpecularLighting surfaceScale="2" specularConstant="0.7" specularExponent="18" lighting-color="#FFFFFF" in="SourceAlpha" result="specular">
        <fePointLight x="-1500" y="-4000" z="6000"/>
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceAlpha" operator="in" result="specularOut"/>
      <feComposite in="SourceGraphic" in2="specularOut" operator="arithmetic" k1="0" k2="1" k3="0.4" k4="0"/>
    </filter>

    <filter id="diamondSparkle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent Background -->

  <!-- ROYAL CROWN -->
  <g transform="translate(1920, 340)" filter="url(#goldGlow)">
    <path d="M-300 130 Q0 155 300 130 L300 95 Q0 120 -300 95 Z" fill="url(#crownGold)"/>
    <path d="M-280 95 L-240 -10 L-200 35 L-140 -70 L0 -115 L140 -70 L200 35 L240 -10 L280 95 Z" fill="url(#luxuryGold)" filter="url(#embossDeep)"/>
    <path d="M-240 -10 L-200 35 L-140 -70 L0 -115" fill="none" stroke="#FFF8E7" stroke-opacity="0.35" stroke-width="2.5"/>
    <path d="M0 -115 L140 -70 L200 35 L240 -10" fill="none" stroke="#FFF8E7" stroke-opacity="0.25" stroke-width="2"/>
    <line x1="-200" y1="35" x2="-200" y2="95" stroke="#8B7020" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="-140" y1="-70" x2="-140" y2="95" stroke="#8B7020" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="0" y1="-115" x2="0" y2="95" stroke="#8B7020" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="140" y1="-70" x2="140" y2="95" stroke="#8B7020" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="200" y1="35" x2="200" y2="95" stroke="#8B7020" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="-255" cy="105" r="12" fill="url(#goldHorizontal)"/>
    <circle cx="-205" cy="105" r="12" fill="url(#goldHorizontal)"/>
    <circle cx="-105" cy="105" r="12" fill="url(#goldHorizontal)"/>
    <circle cx="0" cy="105" r="12" fill="url(#goldHorizontal)"/>
    <circle cx="105" cy="105" r="12" fill="url(#goldHorizontal)"/>
    <circle cx="205" cy="105" r="12" fill="url(#goldHorizontal)"/>
    <circle cx="255" cy="105" r="12" fill="url(#goldHorizontal)"/>

    <!-- DIAMOND GEMSTONES -->
    <g transform="translate(0, -135)" filter="url(#diamondSparkle)">
      <polygon points="0,-28 24,-6 14,24 -14,24 -24,-6" fill="url(#diamondGem)"/>
      <polygon points="0,-22 18,-4 10,18 -10,18 -18,-4" fill="#FFFFFF" fill-opacity="0.75"/>
      <line x1="0" y1="-24" x2="0" y2="20" stroke="#C8E0E8" stroke-width="0.5"/>
      <line x1="-18" y1="-4" x2="14" y2="20" stroke="#C8E0E8" stroke-width="0.3"/>
      <line x1="18" y1="-4" x2="-14" y2="20" stroke="#C8E0E8" stroke-width="0.3"/>
    </g>
    <g transform="translate(-140, -55)" filter="url(#diamondSparkle)">
      <polygon points="0,-18 14,-4 8,14 -8,14 -14,-4" fill="url(#diamondGem)"/>
      <polygon points="0,-14 10,-3 6,10 -6,10 -10,-3" fill="#FFFFFF" fill-opacity="0.7"/>
    </g>
    <g transform="translate(-200, 25)" filter="url(#diamondSparkle)">
      <polygon points="0,-14 12,-3 7,12 -7,12 -12,-3" fill="url(#diamondGem)"/>
      <polygon points="0,-11 9,-2 5,9 -5,9 -9,-2" fill="#FFFFFF" fill-opacity="0.7"/>
    </g>
    <g transform="translate(140, -55)" filter="url(#diamondSparkle)">
      <polygon points="0,-18 14,-4 8,14 -8,14 -14,-4" fill="url(#diamondGem)"/>
      <polygon points="0,-14 10,-3 6,10 -6,10 -10,-3" fill="#FFFFFF" fill-opacity="0.7"/>
    </g>
    <g transform="translate(200, 25)" filter="url(#diamondSparkle)">
      <polygon points="0,-14 12,-3 7,12 -7,12 -12,-3" fill="url(#diamondGem)"/>
      <polygon points="0,-11 9,-2 5,9 -5,9 -9,-2" fill="#FFFFFF" fill-opacity="0.7"/>
    </g>
    <g transform="translate(-260, 65)" filter="url(#diamondSparkle)">
      <polygon points="0,-12 10,-2 6,10 -6,10 -10,-2" fill="url(#diamondGem)"/>
    </g>
    <g transform="translate(260, 65)" filter="url(#diamondSparkle)">
      <polygon points="0,-12 10,-2 6,10 -6,10 -10,-2" fill="url(#diamondGem)"/>
    </g>
  </g>

  <!-- Center Diamond -->
  <g transform="translate(1920, 650)" filter="url(#goldGlow)">
    <polygon points="35,0 65,25 48,58 22,58 5,25" fill="url(#diamondGem)"/>
    <polygon points="35,8 58,27 43,52 27,52 12,27" fill="#FFFFFF" fill-opacity="0.65"/>
  </g>

  <!-- VJ MONOGRAM -->
  <g transform="translate(1920, 820)" filter="url(#premiumShadow)">
    <g transform="translate(-290, 0)">
      <path d="M-130 0 L-65 215 L-35 320 L-95 320 L-130 215 L-150 85 Z" fill="#6B5518" transform="translate(4, 6)" opacity="0.35"/>
      <path d="M-130 0 L-65 215 L-35 320 L-95 320 L-130 215 L-150 85 Z" fill="url(#luxuryGold)" filter="url(#embossDeep)"/>
      <path d="M-125 10 L-70 200 L-45 300 L-85 300 L-125 200 L-145 90 Z" fill="url(#goldHorizontal)" opacity="0.4"/>
      <path d="M-105 45 L-75 165 L-60 210 L-85 165 L-105 85" fill="none" stroke="#FFF8E7" stroke-opacity="0.25" stroke-width="2.5"/>
    </g>
    <g transform="translate(-20, 0)">
      <path d="M0 25 Q-55 25 -55 130 Q-55 280 0 330 L45 330 Q90 330 90 265 Q90 185 60 165 Q35 155 35 145 L35 105 Q35 45 0 45 Q-25 45 -25 70 L-25 70 Q-25 25 0 25" fill="#6B5518" transform="translate(4, 6)" opacity="0.35"/>
      <path d="M0 25 Q-55 25 -55 130 Q-55 280 0 330 L45 330 Q90 330 90 265 Q90 185 60 165 Q35 155 35 145 L35 105 Q35 45 0 45 Q-25 45 -25 70 L-25 70 Q-25 25 0 25" fill="url(#luxuryGold)" filter="url(#embossDeep)"/>
      <path d="M5 35 Q-40 35 -40 120 Q-40 260 5 310" fill="none" stroke="#FFF8E7" stroke-opacity="0.35" stroke-width="3"/>
    </g>
    <path d="M-70 85 Q-90 45 -45 35 Q-25 30 0 45" fill="none" stroke="url(#goldDiagonal)" stroke-width="5" opacity="0.5"/>
    <path d="M25 105 Q50 80 40 55 Q30 35 50 30" fill="none" stroke="url(#goldDiagonal)" stroke-width="4" opacity="0.4"/>
  </g>

  <!-- Text -->
  <g transform="translate(1920, 1520)" text-anchor="middle">
    <text font-family="Playfair Display, Palatino, Georgia, serif" font-size="185" font-weight="600" letter-spacing="28" fill="url(#luxuryGold)" filter="url(#textEmboss)">VAISHNAVI</text>
  </g>
  <g transform="translate(1920, 1700)" text-anchor="middle">
    <text font-family="Montserrat, Century Gothic, Arial, sans-serif" font-size="54" font-weight="300" letter-spacing="38" fill="#D4AF37" fill-opacity="0.8" filter="url(#softGlow)">JEWELLERS</text>
  </g>
  <g transform="translate(1920, 1810)">
    <line x1="-220" y1="0" x2="-70" y2="0" stroke="url(#goldHorizontal)" stroke-width="2" stroke-opacity="0.55"/>
    <circle cx="-52" cy="0" r="5" fill="url(#goldHorizontal)"/>
    <circle cx="52" cy="0" r="5" fill="url(#goldHorizontal)"/>
    <line x1="70" y1="0" x2="220" y2="0" stroke="url(#goldHorizontal)" stroke-width="2" stroke-opacity="0.55"/>
  </g>
</svg>