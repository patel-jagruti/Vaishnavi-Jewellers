<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 50" width="320" height="50">
  <defs>
    <linearGradient id="navGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5E6A3"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#B8942E"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F5E6A3"/>
    </linearGradient>

    <linearGradient id="navDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E8F4F8"/>
      <stop offset="100%" stop-color="#B8D4E8"/>
    </linearGradient>

    <filter id="navShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Crown - Small -->
  <g transform="translate(160, 18)" filter="url(#navShadow)">
    <path d="M-22 8 L-16 2 L-11 5 L-6 -2 L0 -5 L6 -2 L11 5 L16 2 L22 8 Z" fill="url(#navGold)"/>
    <circle cx="-10" cy="3" r="1.5" fill="url(#navDiamond)" opacity="0.85"/>
    <circle cx="10" cy="3" r="1.5" fill="url(#navDiamond)" opacity="0.85"/>
  </g>

  <!-- VJ Monogram -->
  <g transform="translate(85, 38)" filter="url(#navShadow)">
    <text font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="500" fill="url(#navGold)">V</text>
    <text x="26" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="500" fill="url(#navGold)">J</text>
  </g>

  <!-- Center Diamond -->
  <g transform="translate(160, 36)">
    <polygon points="5,0 9,4 7,9 3,9 1,4" fill="url(#navDiamond)"/>
  </g>

  <!-- Brand Text -->
  <g transform="translate(160, 48)" text-anchor="middle">
    <text font-family="Georgia, serif" font-size="9" font-weight="600" letter-spacing="2.5" fill="url(#navGold)">VAISHNAVI</text>
  </g>

  <g transform="translate(160, 53)" text-anchor="middle">
    <text font-family="Arial, sans-serif" font-size="4" letter-spacing="3" fill="#D4AF37" fill-opacity="0.6">JEWELLERS</text>
  </g>
</svg>