<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 70" width="250" height="70">
  <defs>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B1538"/>
      <stop offset="50%" stop-color="#7A1E3A"/>
      <stop offset="100%" stop-color="#5E1030"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#B8942E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="glowGold">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Transparent Background -->

  <!-- Crown -->
  <g transform="translate(15, 8)" filter="url(#glowGold)">
    <path d="M3 18 L12 5 L20 12 L30 3 L38 12 L46 5 L55 18 Z" fill="url(#goldAcc)"/>
    <circle cx="30" cy="4" r="2.5" fill="#FFF"/>
    <circle cx="20" cy="14" r="1.8" fill="#FFF" opacity="0.8"/>
    <circle cx="40" cy="14" r="1.8" fill="#FFF" opacity="0.8"/>
  </g>

  <!-- V -->
  <text x="35" y="60" font-family="Georgia, serif" font-size="45" font-weight="400" fill="url(#maroonGrad)">V</text>

  <!-- J -->
  <text x="60" y="60" font-family="Georgia, serif" font-size="45" font-weight="400" fill="url(#maroonGrad)">J</text>

  <!-- Diamond Sparkle -->
  <g transform="translate(70, 38)">
    <polygon points="8,0 15,7 11,15 5,15 1,7" fill="url(#goldAcc)"/>
  </g>

  <!-- VAISHNAVI -->
  <text x="105" y="32" font-family="Georgia, serif" font-size="18" font-weight="500" letter-spacing="5" fill="url(#maroonGrad)">VAISHNAVI</text>

  <!-- JEWELLERS -->
  <text x="105" y="52" font-family="Georgia, serif" font-size="10" letter-spacing="4" fill="#D4AF37">JEWELLERS</text>

  <!-- Sparkles -->
  <circle cx="28" cy="40" r="0.8" fill="#D4AF37">
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="20" r="0.6" fill="#D4AF37">
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
</svg>
